name: Build Redro Store Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalog.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-native/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Install Capacitor
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html catalog.json manifest.webmanifest sw.js icon.svg www/
          cp -R assets www/assets
      - name: Generate Android project
        run: npx cap add android
      - name: Set increasing Android version code
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, count = re.subn(r'versionCode\\s+\\d+', 'versionCode ' + os.environ["ANDROID_VERSION_CODE"], s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          p.write_text(s)
          PY
      - name: Add native download manager
        run: |
          mkdir -p android/app/src/main/java/com/redro/store
          cp android-native/MainActivity.java android/app/src/main/java/com/redro/store/MainActivity.java
          cp android-native/RedroDownloadsPlugin.java android/app/src/main/java/com/redro/store/RedroDownloadsPlugin.java
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/logos/1795709949305.jpg android/app/src/main/res/drawable-nodpi/redro_store_logo.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/redro_store_logo"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/redro_store_logo"')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Redro-Store-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redro-store-android-v1.0.${{ github.run_number }}
          name: Redro Store Android Release ${{ github.run_number }}
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
